spring.application.name=solar_tpc_server

#Mac dinh lay profile dev
spring.profiles.active=dev
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# Timezone cấu hình
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

# ============================================================
# Distributed Tracing: Spring Boot 4 + OpenTelemetry + Zipkin
# ============================================================
# 1. Lấy mẫu 100% request (dùng cho dev/debug)
management.tracing.sampling.probability=1.0

# 2. Địa chỉ Zipkin server (native Zipkin endpoint /api/v2/spans)
management.zipkin.tracing.endpoint=http://localhost:9412/api/v2/spans

# 3. Expose tất cả Actuator endpoints (để debug - xóa khi production)
management.endpoints.web.exposure.include=*

# JWT Configuration
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

upload.product.dir=${UPLOAD_PRODUCT_DIR:./upload/images/projects}

upload.url.prefix=${UPLOAD_URL_PREFIX:/upload/images/projects/}

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=500MB


management.zipkin.tracing.export.enabled=false
management.tracing.sampling.probability=0